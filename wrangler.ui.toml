name = "lacify-runtime-console"
main = "hosting/worker.js"
compatibility_date = "2026-07-22"
workers_dev = true

[vars]
CONTROL_API_URL = "https://api.runtime.getlacify.com"
CONTROL_UI_ORIGIN = "https://runtime.getlacify.com"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[routes]]
pattern = "runtime.getlacify.com"
custom_domain = true
