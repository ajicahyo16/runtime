version: lacify.dev/actor/v1
name: Workspace
description: Owns private notes for one personal workspace.
partitionBy: workspaceId
storage: sqlite
commands:
  - CreateNote
  - CreateProject
operations:
  - ./operations/create-note.operation.yaml
  - ./operations/get-note.operation.yaml
  - ./operations/create-project.operation.yaml
  - ./operations/get-project.operation.yaml
  - ./operations/list-projects.operation.yaml
