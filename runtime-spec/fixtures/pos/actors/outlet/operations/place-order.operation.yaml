version: lacify.dev/operation/v1
name: PlaceOrder
kind: command
sql: ./place-order.sql
input:
  orderId:
    type: string
    required: true
  total:
    type: integer
    required: true
result:
  mode: one
  fields:
    id:
      type: string
    total:
      type: integer
    status:
      type: string
emits:
  - event: OrderPlaced
    target: realtime
    durability: segmented
    fields:
      - id
      - total
      - status
    realtime:
      roomClass: store
      roomField: $partitionKey
  - event: OrderPlaced
    target: reporting
    durability: immediate
    fields:
      - id
      - total
      - status
    reporting:
      keyField: $partitionKey
      dimensions:
        - status
      measures:
        - field: total
          aggregate: sum
